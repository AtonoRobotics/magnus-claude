name: Pull request validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Rust workspace
        run: cargo test --locked --workspace --lib
      - name: Renderer and browser
        run: |
          node --check desktop/ui/app.js
          node --check desktop/ui/bridge.js
          node desktop/tests/draft-check.mjs
          node --test browser/destinations.test.js
          python3 -I sandbox/test_check_tools.py
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Native desktop checks
        run: cargo test --locked --lib
