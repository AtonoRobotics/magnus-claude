# One-off probe of the build box for the admin console's deployment (not for
# merge; owner, 2026-11-02, allowed CI changes on the build box): strix-alpha's
# network, appliance config and identity provider. Prints no secret: config
# keys and types only, file names and permissions only, and whether secrets
# are set, never their values.
name: desktop
on:
  workflow_dispatch:
jobs:
  release-checks:
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 10
    steps:
      - name: Host and network
        run: |
          hostname; hostname -f 2>/dev/null || true; id -un; uname -r
          ip -o -4 addr show | awk '{print $2, $4}'
          ip route | head -20
          ls /sys/class/net
          systemctl is-active avahi-daemon 2>/dev/null || echo "avahi: not active"
          sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
      - name: Appliance config (keys and safe values only)
        env:
          CFG: ${{ vars.MAGNUS_APPLIANCE_CONFIG }}
        run: |
          echo "config: $CFG"; ls -la "$(dirname "$CFG")"
          python3 -I - "$CFG" <<'PY'
          import sys, tomllib
          c = tomllib.load(open(sys.argv[1], "rb"))
          SAFE = {"listen", "tls_listen", "state_dir", "issuer", "client_id", "hostname", "allow", "org", "name", "url", "audience", "label", "auth", "dir", "id", "groups", "roles", "transport", "catalog", "adapter"}
          def walk(v, path):
              if isinstance(v, dict):
                  for k, x in v.items(): walk(x, path + [k])
              elif isinstance(v, list) and v and isinstance(v[0], dict):
                  for i, x in enumerate(v): walk(x, path + [str(i)])
              else:
                  k = path[-1]
                  print(".".join(path), "=", repr(v) if k in SAFE else type(v).__name__)
          walk(c, [])
          PY
      - name: Services
        run: |
          systemctl --user list-units --all --no-pager 'magnus*' || true
          docker ps --format '{{.Names}}  {{.Image}}  {{.Ports}}' || true
      - name: Identity provider
        run: |
          getent hosts identity.pyrallon.ai || true
          curl -sS -m 10 https://identity.pyrallon.ai/realms/magnus/.well-known/openid-configuration | python3 -I -c 'import json,sys; d=json.load(sys.stdin); print(d["issuer"], d["token_endpoint"])' || true
          ls -la /var/lib/magnus-production-operator /etc/magnus-production-origin 2>&1 | head -20
          curl -sk -m 5 -o /dev/null -w 'keycloak admin origin: %{http_code}\n' https://127.0.0.1:19446/ || true
      - name: Secrets present (yes or no, never values)
        env:
          G: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          [ -n "$G" ] && echo "GOOGLE_CLIENT_SECRET: set" || echo "GOOGLE_CLIENT_SECRET: not set"
