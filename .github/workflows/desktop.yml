# The installed desktop app, tested on Linux; installers (Linux and Windows,
# the same app) are published only when those tests pass (DECISIONS.md).
# Tested builds are also put in the build box's appliance updates directory,
# signed, from where the installed apps update themselves (DECISIONS.md,
# "Release channels"): a pull request to development, master to test, a
# tag to production.
# Runs on a self-hosted runner, `magnus-linux`: the build box, with KVM, the
# guest image and Postgres. One-time setup: desktop/README.md, "Release checks".
# One job: the steps share the build box's disk, so nothing goes through
# GitHub's artifact storage (its quota is small for a private repository).
name: desktop

on:
  push:
    branches: [master]
    tags: ["desktop-v*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # The merge queue's runs, should it become available (it is not on a
  # private repository a person owns): they run everything, like master's.
  merge_group:
  workflow_dispatch:

# A new push to the same pull request cancels the run it replaces. Another
# pull request has its own group, so it does not cancel this one; each merge
# queue entry has a ref of its own, so queue runs never cancel each other.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read
  # Whether the pull request whose build is in development was closed.
  pull-requests: read

env:
  CARGO_TERM_COLOR: never
  # cargo-nextest, the test runner (its latest release on 2026-11-01).
  NEXTEST: 0.9.150

jobs:
  release-checks:
    # A draft is still being written: the installed-app run is the long one,
    # and it starts again when the pull request is marked ready. A skipped
    # required check does not satisfy branch protection, so a draft cannot merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # magnus-linux is build-box and build-box-beta. beta has no release key.
    # Requiring magnus-light as well matched no runner (run 41949170226 sat
    # queued): build-box does not carry that label. A runner without the key
    # builds with a throwaway key and does not publish (release/signing-key.sh).
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 150
    steps:
      # Keep target/ between runs: a clean build of everything is long. The
      # whole history, so publishing can check a release contains the one
      # before it.
      - uses: actions/checkout@v7
        with: { clean: false, fetch-depth: 0 }
      # Postgres and Keycloak, which the tests and the deploy use, up and
      # answering (they may still be starting after a reboot).
      - name: Build box services
        run: dev/services.sh
      # The versions every step builds, tests and publishes: the app's
      # (MAGNUS_VERSION) and the appliance's (MAGNUS_APPLIANCE_VERSION). A
      # tag's app version is its own; any other build is a pre-release of the
      # next version, numbered by run so each is newer than the one before
      # (apps only move forward): `<next>-test.<run>.pr.<n>` for pull request
      # n, else `<next>-test.<run>`. The same build goes to development and,
      # once merged, to test (below), so its version names its run, not a
      # channel.
      # Which tests this run needs (release/ci-select.sh): a pull request
      # runs what its changed paths reach, and the installers and the
      # installed app only when desktop/ (or anything unknown) changed;
      # master, the merge queue, tags and a manual run test everything.
      - name: What this change tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | release/ci-select.sh | tee -a "$GITHUB_ENV"
          else
            echo MAGNUS_SELECT=full | tee -a "$GITHUB_ENV"
          fi
      # Realms and mail sinks that killed or cancelled tests left on the
      # test Keycloak (release/ci-clean.sh; test ones only, never the
      # appliance's).
      - name: Clear what earlier tests left
        run: release/ci-clean.sh
      - name: Version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pre="test.${{ github.run_number }}${PR:+.pr.$PR}"
          next() { git ls-remote --exit-code --tags origin "$1$2" >/dev/null && echo "${2%.*}.$(( ${2##*.} + 1 ))" || echo "$2"; }
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$TAG" = true ] || v="$(next desktop-v "$v")-$pre"
          a=$(cargo metadata --no-deps --format-version 1 | python3 -I -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='magnus'))")
          echo "MAGNUS_VERSION=$v" >> "$GITHUB_ENV"
          echo "MAGNUS_APPLIANCE_VERSION=$(next appliance-v "$a")-$pre" >> "$GITHUB_ENV"
      # The updater packages (AppImage, setup.exe) are signed with the release
      # key, which is on the build box only, bound to the version.
      # Tested once when the merge changes nothing: a merge to master whose
      # files are exactly its pull request's, which passed these checks, is
      # not tested again, and publishes the build that passed them (kept
      # below, by its files' tree), versions included; only when that build
      # is no longer kept, or the merge changed the files, is it built again.
      - name: Tested already
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse --verify -q HEAD^2) || exit 0
          [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ] || exit 0
          passed=$(gh api "repos/${{ github.repository }}/commits/$head/check-runs?check_name=release-checks" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          # A pull request that ran only some tests keeps no build: only one
          # that ran everything counts as tested (release/ci-select.sh).
          b="$HOME/magnus-ci/builds/$(git rev-parse HEAD^{tree})"
          if [ "$passed" -gt 0 ] && [ -f "$b/versions" ]; then
            echo "MAGNUS_TESTED=1" >> "$GITHUB_ENV"
            echo "the merged files are $head's, which passed every release check: not testing again"
            cat "$b/versions" >> "$GITHUB_ENV"
            echo "MAGNUS_BUILT=$b" >> "$GITHUB_ENV"
            echo "publishing the build that passed them: $(cat "$b/versions" | tr '\n' ' ')"
          fi
      # cargo-tauri is a binary on PATH, not a rustup component. A runner that
      # has rustup and not this binary stops at `cargo tauri` before any test.
      - name: Tauri CLI
        if: env.MAGNUS_BUILT == '' && env.MAGNUS_SELECT == 'full'
        run: release/ensure-tauri.sh >> "$GITHUB_PATH"
      # The release key is on the build box only. Another magnus-linux runner
      # gets a throwaway key and MAGNUS_PUBLISH=0, so it can test and cannot
      # replace the owner's app or the channels.
      - name: Signing key
        if: env.MAGNUS_SELECT == 'full'
        run: |
          real="${MAGNUS_RELEASE_KEY:-$HOME/.magnus-release/update.key}"
          if [ -n "${MAGNUS_BUILT:-}" ]; then
            if [ -f "$real" ]; then
              echo "MAGNUS_SIGNING_KEY=$real" >> "$GITHUB_ENV"
              echo "MAGNUS_PUBLISH=1" >> "$GITHUB_ENV"
            else
              echo "MAGNUS_PUBLISH=0" >> "$GITHUB_ENV"
              echo "::notice::reused build on a runner with no release key; not publishing"
            fi
          else
            out=$(release/signing-key.sh "$RUNNER_TEMP/signing")
            echo "MAGNUS_SIGNING_KEY=$(printf '%s\n' "$out" | sed -n 1p)" >> "$GITHUB_ENV"
            echo "MAGNUS_PUBLISH=$(printf '%s\n' "$out" | sed -n 2p)" >> "$GITHUB_ENV"
            [ "$(printf '%s\n' "$out" | sed -n 2p)" = 1 ] || echo "::notice::no release key on this runner; the installers are signed with a throwaway key and not published"
          fi
      - name: Installers
        if: env.MAGNUS_BUILT == '' && env.MAGNUS_SELECT == 'full'
        working-directory: desktop/src-tauri
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$MAGNUS_SIGNING_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          "$GITHUB_WORKSPACE/release/ensure-windows-target.sh"
          # build-box-beta has rustup and not this target (run 41957162011),
          # and not mingw's dlltool once the target is added (run 41958793139).
          rustup target add x86_64-pc-windows-gnu
          if ! command -v x86_64-w64-mingw32-dlltool >/dev/null || ! command -v makensis >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
          fi
          c="{\"version\":\"$MAGNUS_VERSION\"}"
          cargo tauri build --bundles deb,appimage --config "$c"
          cargo tauri build --runner cargo --target x86_64-pc-windows-gnu --bundles nsis --config "$c"
      - name: Collect this version's installers
        if: env.MAGNUS_BUILT != '' || env.MAGNUS_SELECT == 'full'
        run: |
          rm -rf dist
          if [ -n "${MAGNUS_BUILT:-}" ]; then
            cp -r "$MAGNUS_BUILT/dist" dist && (cd dist && sha256sum -c --quiet SHA256SUMS)
            exit 0
          fi
          v=$MAGNUS_VERSION
          b=desktop/src-tauri/target
          mkdir dist
          cp "$b/release/bundle/deb/Magnus_${v}_amd64.deb" "$b/release/bundle/appimage/Magnus_${v}_amd64.AppImage" \
             "$b/x86_64-pc-windows-gnu/release/bundle/nsis/Magnus_${v}_x64-setup.exe" dist/
          (cd dist && sha256sum Magnus_* > SHA256SUMS)
      - name: Install the app from its package
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT == 'full'
        run: |
          v=$MAGNUS_VERSION
          rm -rf "$RUNNER_TEMP/app" && dpkg-deb -x "dist/Magnus_${v}_amd64.deb" "$RUNNER_TEMP/app"
      # The tests launch the appliance and the model adapters as programs;
      # `cargo test` builds only the test package's own.
      - name: Programs the tests launch
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        run: cargo build --workspace --bins
      # The sandbox guest built from this commit (sandbox/image.sh).
      - name: Sandbox image
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        run: |
          d=$(sandbox/image.sh)
          echo "MAGNUS_GUEST_KERNEL=$d/vmlinux" >> "$GITHUB_ENV"
          echo "MAGNUS_GUEST_ROOTFS=$d/rootfs.ext4" >> "$GITHUB_ENV"
      # Which contract checks are appliance-verified, self-checked or refused
      # (sandbox/check_tools.py, which the image runs when a contract is
      # recorded). Its program lookups use the build box.
      - name: Check-tool labels
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        run: python3 -I sandbox/test_check_tools.py
      # Every suite, on every ready pull request and master build, before its
      # build can reach an app. A draft skips this job.
      - name: Browser sidecar
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        run: npm ci --prefix browser
      # Every test of every binary at once (cargo-nextest; `cargo test` runs
      # the binaries one after another: 18 minutes, against 5). Each test
      # has a time limit (.config/nextest.toml, profile ci).
      - name: Test runner
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        run: cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest $NEXTEST " || cargo install --locked "cargo-nextest@$NEXTEST"
      # The browser flows keep a screenshot of a failed step (kept below).
      - name: Unit, invariant and scratch tests
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT != 'none'
        env:
          MAGNUS_SHOTS: ${{ runner.temp }}/shots
        run: |
          set --
          [ -z "${MAGNUS_FILTER:-}" ] || set -- -E "$MAGNUS_FILTER"
          cargo nextest run --profile ci -p magnus -p magnus-brokered-kit -p magnus-brokered-google -p magnus-gmail -p magnus-calendar -p magnus-chat -p magnus-slack -p magnus-invariants -p magnus-scratch --no-fail-fast --no-tests=pass "$@"
      # After the suite, not beside it. Compiling these on every core during
      # the tests made browser clicks and sign-ins time out (run 41267885346,
      # and again 41949527809: 7 failures, 407 passes). nice did not keep
      # them off the suite. The installed-app tests wait for them below.
      - name: Start the update test's two builds
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT == 'full'
        run: |
          t="$RUNNER_TEMP/update-test" && rm -rf "$t" && mkdir -p "$t"
          (nice -n 19 desktop/tests/update-builds.sh "$MAGNUS_VERSION" "$t" > "$t/build.log" 2>&1; echo $? > "$t/build.status") &
      - name: The update test's two builds
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT == 'full'
        timeout-minutes: 60
        run: |
          t="$RUNNER_TEMP/update-test"
          until [ -f "$t/build.status" ]; do sleep 5; done
          s=$(cat "$t/build.status")
          [ "$s" = 0 ] || { tail -50 "$t/build.log"; exit "$s"; }
      # build-box-beta has no WebKitWebDriver, so every installed-app test
      # stopped at once (run 41959422399). desktop/README.md names the package.
      - name: Installed-app drivers
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT == 'full'
        run: |
          pkgs=""
          command -v WebKitWebDriver >/dev/null || pkgs=" webkit2gtk-driver"
          command -v xclip >/dev/null || pkgs=" xclip"
          if [ -n "" ]; then
            sudo -n apt-get update -qq
            # shellcheck disable=SC2086
            sudo -n apt-get install -y 
          fi
          if ! command -v tauri-driver >/dev/null && [ ! -x "${CARGO_HOME:-$HOME/.cargo}/bin/tauri-driver" ]; then
            cargo install tauri-driver --locked
          fi
      # They take about two minutes; a hang fails here, not at the job's end.
      - name: Installed-app tests
        if: env.MAGNUS_TESTED != '1' && env.MAGNUS_SELECT == 'full'
        timeout-minutes: 20
        env:
          MAGNUS_DESKTOP_APP: ${{ runner.temp }}/app/usr/bin/magnus-desktop
          MAGNUS_SHOTS: ${{ runner.temp }}/shots
          MAGNUS_UPDATE_BUILDS: ${{ runner.temp }}/update-test
        run: cargo test -p magnus-scratch --test desktop_app -- --ignored
      - name: Keep the screenshots of a failure on the build box
        if: failure()
        run: |
          d="$HOME/magnus-ci/shots/${{ github.run_id }}"
          mkdir -p "$d" && cp -r "$RUNNER_TEMP/shots/." "$d/" 2>/dev/null || true
          echo "screenshots: $d"
      - name: Pre-release with the tested installers
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.MAGNUS_PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=$MAGNUS_VERSION
          [ "$TAG" = "desktop-v$v" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --verify-tag --prerelease --title "Desktop $v" --notes-from-tag \
            "dist/Magnus_${v}_amd64.deb" "dist/Magnus_${v}_amd64.AppImage" "dist/Magnus_${v}_x64-setup.exe"
      - name: Updates for the installed apps
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.MAGNUS_PUBLISH == '1'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$MAGNUS_VERSION
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes"
          release/publish.sh desktop "$v" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist
      # The build that passed, kept on the build box for master's run after
      # the merge, which publishes it unchanged (above, "Tested already"):
      # keyed by the files' tree, so it is used only for exactly these files.
      # The newest two are kept: the one under review and, while master's
      # run for the one before may still be waiting, that one. The
      # appliance's release programs are built here, after the tests: built
      # beside them (a third build with the update test's two), they slowed
      # the tests until an appliance missed its 30 s start (run 41265192814).
      # Only a run that tested everything keeps one.
      - name: Keep this build for master
        if: github.event_name == 'pull_request' && env.MAGNUS_SELECT == 'full' && env.MAGNUS_PUBLISH == '1'
        run: |
          cargo build --release --workspace --bins
          store="$HOME/magnus-ci/builds" && b="$store/$(git rev-parse HEAD^{tree})"
          rm -rf "$b.part" && mkdir -p "$b.part/appliance"
          cp -r dist "$b.part/dist"
          cp $(sed 's#^#target/release/#' release/appliance-programs) "$b.part/appliance/"
          printf 'MAGNUS_VERSION=%s\nMAGNUS_APPLIANCE_VERSION=%s\n' "$MAGNUS_VERSION" "$MAGNUS_APPLIANCE_VERSION" > "$b.part/versions"
          rm -rf "$b" && mv -T "$b.part" "$b"
          ls -dt "$store"/*/ | tail -n +3 | xargs -r rm -rf
      # A pull request's tested build goes to development, the owner's apps;
      # once merged, master's goes to test, the testers'.
      # The build there may be a pull request's that was closed without
      # merging: its work was given up, so this one need only hold master's
      # (release/publish.sh, MAGNUS_GIVEN_UP). Or it merged: its work is the
      # master commit it landed as, even squashed (MAGNUS_LANDED).
      # Only a pull request that built and tested the installers (one that
      # changed desktop/ or the build) publishes to development.
      - name: Development build for the installed apps
        if: github.event_name == 'pull_request' && env.MAGNUS_SELECT == 'full' && env.MAGNUS_PUBLISH == '1'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          MAGNUS_PR: ${{ github.event.pull_request.number }}
          MAGNUS_COMMIT: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\nDevelopment build of pull request #%s.\n' "$TITLE" "$PR" > "$RUNNER_TEMP/notes"
          there="${{ vars.MAGNUS_UPDATES_DIR }}/desktop/development/latest.json"
          prev=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1])).get("pr", ""))' "$there" 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$PR" ]; then
            case $(gh pr view "$prev" --json state -q .state) in
            CLOSED) export MAGNUS_GIVEN_UP=$prev ;;
            MERGED) export MAGNUS_LANDED="$prev=$(gh pr view "$prev" --json mergeCommit -q .mergeCommit.oid)" ;;
            esac
          fi
          release/publish.sh desktop "$MAGNUS_VERSION" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist development
      - name: Test build for the installed apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.MAGNUS_PUBLISH == '1'
        run: |
          s=$(git log -1 --format=%s)
          case $s in "Merge pull request #"*) t=$(git log -1 --format=%b | head -1) ;; *) t=$s ;; esac
          printf '%s\n\nTest build: master at %s.\n' "$t" "$(git rev-parse --short HEAD)" > "$RUNNER_TEMP/notes"
          release/publish.sh desktop "$MAGNUS_VERSION" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist test
      # Master also runs on the build box's own appliance, which installs
      # it by itself (DECISIONS.md, "Master runs on the build box's
      # appliance"): MAGNUS_APPLIANCE_VERSION, numbered like the app's; its
      # pull request's kept programs when there are, else built here.
      - name: Master on the build box's appliance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.MAGNUS_PUBLISH == '1'
        run: |
          p=${MAGNUS_BUILT:+$MAGNUS_BUILT/appliance}
          [ -n "$p" ] || { cargo build --release --workspace --bins; p=target/release; }
          release/to-appliance.sh "${{ vars.MAGNUS_APPLIANCE_CONFIG }}" "$MAGNUS_APPLIANCE_VERSION" "$RUNNER_TEMP/notes" "$p"
          echo "MAGNUS_APPLIANCE_PROGRAMS=$p" >> "$GITHUB_ENV"
      # The admin console beside it (DECISIONS.md, "The admin console on
      # strix-alpha"), and Google's client secret into its vault when the
      # repository has it (owner, 2026-11-02).
      - name: The admin console on the build box's appliance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.MAGNUS_PUBLISH == '1'
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: release/admin-on-appliance.sh "${{ vars.MAGNUS_APPLIANCE_CONFIG }}" "$MAGNUS_APPLIANCE_PROGRAMS"
