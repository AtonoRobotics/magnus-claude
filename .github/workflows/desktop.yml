# The installed desktop app, tested on Linux; installers (Linux and Windows,
# the same app) are published only when those tests pass (DECISIONS.md).
# Tested builds are also put in the build box's appliance updates directory,
# signed, from where the installed apps update themselves (DECISIONS.md,
# "Release channels"): a pull request to development, master to test, a
# tag to production.
# Runs on a self-hosted runner, `magnus-linux`: the build box, with KVM, the
# guest image and Postgres. One-time setup: desktop/README.md, "Release checks".
# One job: the steps share the build box's disk, so nothing goes through
# GitHub's artifact storage (its quota is small for a private repository).
name: desktop

on:
  push:
    branches: [master]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

env:
  CARGO_TERM_COLOR: never

jobs:
  release-checks:
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 150
    steps:
      # Keep target/ between runs: a clean build of everything is long. The
      # whole history, so publishing can check a release contains the one
      # before it.
      - uses: actions/checkout@v7
        with: { clean: false, fetch-depth: 0 }
      # The version every step builds, tests and publishes. A tag's is the
      # app's own; any other build is a pre-release of the next version,
      # numbered by run so each is newer than the one before (apps only move
      # forward): `<next>-review.<run>.pr.<n>` for pull request n, else
      # `<next>-test.<run>`.
      - name: Version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != true ]; then
            git ls-remote --exit-code --tags origin "desktop-v$v" >/dev/null && v="${v%.*}.$(( ${v##*.} + 1 ))"
            if [ -n "$PR" ]; then v="$v-review.${{ github.run_number }}.pr.$PR"; else v="$v-test.${{ github.run_number }}"; fi
          fi
          echo "MAGNUS_VERSION=$v" >> "$GITHUB_ENV"
      # The updater packages (AppImage, setup.exe) are signed with the release
      # key, which is on the build box only, bound to the version.
      # Tested once (DECISIONS.md, "One pull request at a time"): a merge
      # to master whose files are exactly its pull request's, which passed
      # these checks, is built and published, not tested again.
      - name: Tested already
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse --verify -q HEAD^2) || exit 0
          [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ] || exit 0
          passed=$(gh api "repos/${{ github.repository }}/commits/$head/check-runs?check_name=release-checks" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "MAGNUS_TESTED=1" >> "$GITHUB_ENV"
            echo "the merged files are $head's, which passed release-checks: not testing again"
          fi
      - name: Installers
        working-directory: desktop/src-tauri
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$HOME/.magnus-release/update.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          c="{\"version\":\"$MAGNUS_VERSION\"}"
          cargo tauri build --bundles deb,appimage --config "$c"
          cargo tauri build --runner cargo --target x86_64-pc-windows-gnu --bundles nsis --config "$c"
      - name: Collect this version's installers
        run: |
          v=$MAGNUS_VERSION
          b=desktop/src-tauri/target
          rm -rf dist && mkdir dist
          cp "$b/release/bundle/deb/Magnus_${v}_amd64.deb" "$b/release/bundle/appimage/Magnus_${v}_amd64.AppImage" \
             "$b/x86_64-pc-windows-gnu/release/bundle/nsis/Magnus_${v}_x64-setup.exe" dist/
          (cd dist && sha256sum Magnus_* > SHA256SUMS)
      # The update test's two AppImages: this version and the next, with a
      # key made for the run, so nothing it signs could install anywhere.
      - name: Two builds for the update test
        if: env.MAGNUS_TESTED != '1'
        working-directory: desktop/src-tauri
        run: |
          v=$MAGNUS_VERSION
          t="$RUNNER_TEMP/update-test" && rm -rf "$t" && mkdir -p "$t"
          cargo tauri signer generate --ci -p "" -f -w "$t/test.key" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$t/test.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          next="${v%.*}.$(( ${v##*.} + 1 ))"
          for build in "old $v" "new $next"; do
            set -- $build
            cargo tauri build --bundles appimage --config "{\"version\":\"$2\",\"plugins\":{\"updater\":{\"pubkey\":\"$(cat "$t/test.key.pub")\"}}}"
            cp "target/release/bundle/appimage/Magnus_$2_amd64.AppImage" "$t/$1.AppImage"
            cp "target/release/bundle/appimage/Magnus_$2_amd64.AppImage.sig" "$t/$1.AppImage.sig"
          done
          echo "$next" > "$t/new.version"
      - name: Install the app from its package
        if: env.MAGNUS_TESTED != '1'
        run: |
          v=$MAGNUS_VERSION
          rm -rf "$RUNNER_TEMP/app" && dpkg-deb -x "dist/Magnus_${v}_amd64.deb" "$RUNNER_TEMP/app"
      # The tests launch the appliance and the model adapters as programs;
      # `cargo test` builds only the test package's own.
      - name: Programs the tests launch
        if: env.MAGNUS_TESTED != '1'
        run: cargo build --workspace --bins
      # The sandbox guest built from this commit (sandbox/image.sh).
      - name: Sandbox image
        if: env.MAGNUS_TESTED != '1'
        run: |
          d=$(sandbox/image.sh)
          echo "MAGNUS_GUEST_KERNEL=$d/vmlinux" >> "$GITHUB_ENV"
          echo "MAGNUS_GUEST_ROOTFS=$d/rootfs.ext4" >> "$GITHUB_ENV"
      # Every suite, on every pull request and master build, before its
      # build can reach an app (DECISIONS.md, "One pull request at a time").
      - name: Browser sidecar
        if: env.MAGNUS_TESTED != '1'
        run: npm ci --prefix browser
      - name: Unit, invariant and scratch tests
        if: env.MAGNUS_TESTED != '1'
        run: cargo test -p magnus -p magnus-invariants -p magnus-scratch --no-fail-fast
      - name: Installed-app tests
        if: env.MAGNUS_TESTED != '1'
        env:
          MAGNUS_DESKTOP_APP: ${{ runner.temp }}/app/usr/bin/magnus-desktop
          MAGNUS_SHOTS: ${{ runner.temp }}/shots
          MAGNUS_UPDATE_BUILDS: ${{ runner.temp }}/update-test
        run: cargo test -p magnus-scratch --test desktop_app -- --ignored
      - name: Keep the screenshots of a failure on the build box
        if: failure()
        run: |
          d="$HOME/magnus-ci/shots/${{ github.run_id }}"
          mkdir -p "$d" && cp -r "$RUNNER_TEMP/shots/." "$d/" 2>/dev/null || true
          echo "screenshots: $d"
      - name: Pre-release with the tested installers
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=$MAGNUS_VERSION
          [ "$TAG" = "desktop-v$v" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --verify-tag --prerelease --title "Desktop $v" --notes-from-tag \
            "dist/Magnus_${v}_amd64.deb" "dist/Magnus_${v}_amd64.AppImage" "dist/Magnus_${v}_x64-setup.exe"
      - name: Updates for the installed apps
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$MAGNUS_VERSION
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes"
          release/publish.sh desktop "$v" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist
      # A pull request's tested build goes to development, the owner's apps;
      # once merged, master's goes to test, the testers'.
      - name: Development build for the installed apps
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          MAGNUS_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n\nDevelopment build of pull request #%s.\n' "$TITLE" "$PR" > "$RUNNER_TEMP/notes"
          release/publish.sh desktop "$MAGNUS_VERSION" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist development
      - name: Test build for the installed apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          s=$(git log -1 --format=%s)
          case $s in "Merge pull request #"*) t=$(git log -1 --format=%b | head -1) ;; *) t=$s ;; esac
          printf '%s\n\nTest build: master at %s.\n' "$t" "$(git rev-parse --short HEAD)" > "$RUNNER_TEMP/notes"
          release/publish.sh desktop "$MAGNUS_VERSION" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" dist test
