# The installed desktop app, tested on Linux; installers (Linux and Windows,
# the same app) are published only when those tests pass (DECISIONS.md).
# Runs on a self-hosted runner, `magnus-linux`: the build box, with KVM, the
# guest image and Postgres. One-time setup: desktop/README.md, "Release checks".
# One job: the steps share the build box's disk, so nothing goes through
# GitHub's artifact storage (its quota is small for a private repository).
name: desktop

on:
  push:
    branches: [master]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  # Machine paths on the build box, kept in repository variables.
  MAGNUS_GUEST_KERNEL: ${{ vars.MAGNUS_SANDBOX_OUT }}/vmlinux
  MAGNUS_GUEST_ROOTFS: ${{ vars.MAGNUS_SANDBOX_OUT }}/rootfs.ext4

jobs:
  release-checks:
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 150
    steps:
      # Keep target/ between runs: a clean build of everything is long.
      - uses: actions/checkout@v7
        with: { clean: false }
      - name: Installers
        working-directory: desktop/src-tauri
        run: |
          cargo tauri build --bundles deb,appimage
          cargo tauri build --runner cargo --target x86_64-pc-windows-gnu --bundles nsis
      - name: Collect this version's installers
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          b=desktop/src-tauri/target
          rm -rf dist && mkdir dist
          cp "$b/release/bundle/deb/Magnus_${v}_amd64.deb" "$b/release/bundle/appimage/Magnus_${v}_amd64.AppImage" \
             "$b/x86_64-pc-windows-gnu/release/bundle/nsis/Magnus_${v}_x64-setup.exe" dist/
          (cd dist && sha256sum Magnus_* > SHA256SUMS)
      - name: Install the app from its package
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          rm -rf "$RUNNER_TEMP/app" && dpkg-deb -x "dist/Magnus_${v}_amd64.deb" "$RUNNER_TEMP/app"
      # The tests launch the appliance and the model adapters as programs;
      # `cargo test` builds only the test package's own.
      - name: Programs the tests launch
        run: cargo build --workspace --bins
      - name: Installed-app tests
        env:
          MAGNUS_DESKTOP_APP: ${{ runner.temp }}/app/usr/bin/magnus-desktop
          MAGNUS_SHOTS: ${{ runner.temp }}/shots
        run: cargo test -p magnus-scratch --test desktop_app -- --ignored
      - name: Keep the screenshots of a failure on the build box
        if: failure()
        run: |
          d="$HOME/magnus-ci/shots/${{ github.run_id }}"
          mkdir -p "$d" && cp -r "$RUNNER_TEMP/shots/." "$d/" 2>/dev/null || true
          echo "screenshots: $d"
      - name: Pre-release with the tested installers
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$TAG" = "desktop-v$v" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --verify-tag --prerelease --title "Desktop $v" --notes-from-tag \
            "dist/Magnus_${v}_amd64.deb" "dist/Magnus_${v}_amd64.AppImage" "dist/Magnus_${v}_x64-setup.exe"
