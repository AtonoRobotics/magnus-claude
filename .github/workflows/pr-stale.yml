# Pull requests with nobody touching them pile up (CLAUDE.md, "How work
# lands"). Every six hours: a comment after a day, the stale label after
# three, and a close after five. The branch is kept; hold stops the close
# (release/pr-stale.sh).
name: pr-stale

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # A light runner, like the rules check's (pr-rules.yml).
  stale:
    runs-on: [self-hosted, linux, magnus-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Name what each waiting pull request waits on
        env:
          GH_TOKEN: ${{ github.token }}
        run: release/pr-stale.sh
