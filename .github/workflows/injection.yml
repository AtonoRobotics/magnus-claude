# The injection suite (X16), AgentDojo-style: on every change to the
# boundary (what execute() decides with, and the loop that calls it), the
# attacks in tests/scratch/tests/injection.rs run against the kernel with a
# model that obeys every instruction it reads. It fails if any gets past.
# Same build box as the desktop checks (desktop/README.md, "Release checks").
name: injection

on:
  push:
    branches: [master]
    paths: &boundary
      - crates/magnus/src/boundary.rs
      - crates/magnus/src/policy.rs
      - crates/magnus/src/tools.rs
      - crates/magnus/src/apps.rs
      - crates/magnus/src/connectors.rs
      - crates/magnus/src/web.rs
      - crates/magnus/src/browser.rs
      - crates/magnus/src/vault.rs
      - crates/magnus/src/state.rs
      - crates/magnus/src/events.rs
      - crates/magnus/src/run/**
      - tests/scratch/tests/injection.rs
      - .github/workflows/injection.yml
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths: *boundary
  workflow_dispatch:

concurrency:
  group: injection-${{ github.ref }}
  # A pull request's new push cancels its earlier run; master's runs wait
  # for each other, so each finishes and the next tests all merged since (#228).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  injection:
    # Drafts skip this the same way they skip the desktop run. Marking the
    # pull request ready starts it, because ready_for_review is a trigger.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      # Postgres and Keycloak, which the tests and the deploy use, up and
      # answering (they may still be starting after a reboot).
      - name: Build box services
        run: dev/services.sh
      # The sandbox guest built from this commit (sandbox/image.sh).
      - name: Sandbox image
        run: |
          d=$(sandbox/image.sh)
          echo "MAGNUS_GUEST_KERNEL=$d/vmlinux" >> "$GITHUB_ENV"
          echo "MAGNUS_GUEST_ROOTFS=$d/rootfs.ext4" >> "$GITHUB_ENV"
      - name: Programs the suite launches
        run: cargo build --workspace --bins
      - name: Injection suite
        run: cargo test -p magnus-scratch --test injection -- --nocapture
