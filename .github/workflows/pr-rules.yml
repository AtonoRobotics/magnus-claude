# The pull request rules (CLAUDE.md, "How work lands"; release/pr-rules.sh):
# an agent pull request past the cap fails, every pull request merges into
# master, a large diff is a warning, and a branch behind master is a notice
# (not a reason to merge master in).
# The checkout GitHub builds for a pull request is its merge with master,
# so this script is the one on master even when the branch has not merged
# master in. The head commit is passed separately.
# A merge queue run has already satisfied these rules on each pull request.
# On a light runner (magnus-light: build-box-2, and build-box), so it never
# waits behind a release-checks run (owner, 2026-11-04: "Use build-box-2 for
# quick checks only").
name: pr-rules

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  rules:
    runs-on: [self-hosted, linux, magnus-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: The pull request rules
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            echo "merge queue: each pull request already passed these rules"
            exit 0
          fi
          git fetch -q origin master
          # cursor/ branches, bot authors, the agent label, and Claude Code.
          MAGNUS_OPEN_PRS=$(gh pr list --state open --limit 100 \
            --json number,headRefName,author,labels,body --jq '
              def agent:
                ((.headRefName // "") | startswith("cursor/"))
                or (.author.is_bot == true)
                or ((.author.login // "") | endswith("[bot]"))
                or (((.labels // []) | map(.name)) | index("agent") != null)
                or ((.body // "") | test("Generated with \\[?Claude"));
              .[] | "\(.number):\(if agent then "agent" else "human" end)"
            ' | tr '\n' ' ')
          export MAGNUS_OPEN_PRS
          case $BRANCH in
          cursor/*) export MAGNUS_PR_AGENT=1 ;;
          esac
          if [ "$AUTHOR_TYPE" = Bot ]; then export MAGNUS_PR_AGENT=1; fi
          case $AUTHOR in
          *"[bot]") export MAGNUS_PR_AGENT=1 ;;
          esac
          release/pr-rules.sh "$PR" "$HEAD" "$BASE" "$(git rev-parse origin/master)"
