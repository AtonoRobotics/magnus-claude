# Appliance releases: a tag `appliance-vX.Y.Z` (the workspace version) is
# built, tested with the invariants and the scratch suites, and only then put,
# signed, in the build box's appliance updates directory, where the appliance
# installs it within the hour (DECISIONS.md, "Appliance updates").
# Same build box as the desktop checks (desktop/README.md, "Release checks").
name: appliance

on:
  push:
    tags: ["appliance-v*"]
  workflow_dispatch:

concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # cargo-nextest, the test runner (its latest release on 2026-11-01).
  NEXTEST: 0.9.150

jobs:
  release:
    runs-on: [self-hosted, linux, magnus-linux]
    timeout-minutes: 120
    steps:
      # The whole history, so publishing can check a release contains the
      # one before it.
      - uses: actions/checkout@v7
        with: { clean: false, fetch-depth: 0 }
      # Postgres and Keycloak, which the tests and the deploy use, up and
      # answering (they may still be starting after a reboot).
      - name: Build box services
        run: dev/services.sh
      # The browser sidecar's packages (some suites drive a browser).
      # The sandbox guest built from this commit (sandbox/image.sh).
      - name: Sandbox image
        run: |
          d=$(sandbox/image.sh)
          echo "MAGNUS_GUEST_KERNEL=$d/vmlinux" >> "$GITHUB_ENV"
          echo "MAGNUS_GUEST_ROOTFS=$d/rootfs.ext4" >> "$GITHUB_ENV"
      - name: Browser sidecar
        run: npm ci --prefix browser
      - name: Programs the tests launch
        run: cargo build --workspace --bins
      - name: Test runner
        run: cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest $NEXTEST " || cargo install --locked "cargo-nextest@$NEXTEST"
      - name: Invariants and scratch suites
        run: cargo nextest run -p magnus-invariants -p magnus-scratch --no-fail-fast
      - name: Release programs
        run: cargo build --release --workspace --bins
      - name: Into the appliance's updates
        if: startsWith(github.ref, 'refs/tags/appliance-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -I -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='magnus'))")
          [ "$TAG" = "appliance-v$v" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes"
          release/publish.sh appliance "$v" "${{ vars.MAGNUS_UPDATES_DIR }}" "$RUNNER_TEMP/notes" \
            target/release/magnus target/release/magnus-adapter-anthropic target/release/magnus-adapter-openai browser
