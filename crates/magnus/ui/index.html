<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnus</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1d1c1a; --muted: #6b6862;
  --line: #dcd9d2; --accent: #2f5bd3; --ok: #1f7a4a; --warn: #a15c00; --bad: #b3261e; --focus: #2f5bd3;
  --chip-ok: #e3f2e9; --chip-warn: #fbefdc; --chip-bad: #fbe4e2; --chip-info: #e6ecfb;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --surface: #1f1f1c; --surface-2: #2a2a26; --text: #ecebe7; --muted: #a29f97;
    --line: #3a3934; --accent: #8aa8ff; --ok: #6fcf97; --warn: #f2b25c; --bad: #ff8a80;
    --chip-ok: #1f3a2a; --chip-warn: #3d2e17; --chip-bad: #42201d; --chip-info: #232d47;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
textarea, input[type=text], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { resize: vertical; min-height: 84px; }
code, pre { font-family: var(--mono); font-size: 13px; }
pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0; max-height: 360px; }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
nav .brand { font-weight: 650; font-size: 18px; padding: 4px 10px 16px; letter-spacing: -0.01em; }
nav a { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
nav a.on { background: var(--surface-2); font-weight: 600; }
nav .badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 12px; padding: 0 7px; min-width: 20px; text-align: center; }
nav .who { margin-top: auto; color: var(--muted); font-size: 13px; padding: 10px; }
main { padding: 24px 32px 64px; max-width: 980px; width: 100%; }
h1 { font-size: 22px; margin: 0 0 18px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 22px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.card.risk-irreversible, .card.risk-financial { border-left: 4px solid var(--warn); }
.card.risk-prohibited { border-left: 4px solid var(--bad); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chip { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--chip-info); white-space: nowrap; }
.chip.ok { background: var(--chip-ok); color: var(--ok); } .chip.warn { background: var(--chip-warn); color: var(--warn); } .chip.bad { background: var(--chip-bad); color: var(--bad); }
.task { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; cursor: pointer; }
.task:hover { border-color: var(--accent); }
.crit { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.crit:first-child { border-top: 0; }
.mark { font-weight: 700; } .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.wait { color: var(--muted); }
details { border-top: 1px solid var(--line); padding: 8px 0; } details summary { cursor: pointer; }
.step-text { white-space: pre-wrap; }
.live { white-space: pre-wrap; border-left: 3px solid var(--accent); padding-left: 10px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.files { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.login { max-width: 420px; margin: 12vh auto; }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; display: none; max-width: 420px; }
@media (max-width: 720px) { .app { grid-template-columns: 1fr; } nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } nav .who, nav .brand { display: none; } main { padding: 16px; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
let token = store.get("magnus.token");
let me = null, view = { page: "inbox", task: null }, timer = null;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "authorization": "Bearer " + token, "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { store.del("magnus.token"); token = null; render(); throw new Error("signed out"); }
  const text = await r.text(); let v; try { v = JSON.parse(text); } catch { v = text; }
  if (!r.ok) throw new Error((v && v.error) || ("HTTP " + r.status));
  return v;
}
const statusChip = s => `<span class="chip ${s === "completed" ? "ok" : s === "failed" || s === "cancelled" ? "bad" : s === "suspended" ? "warn" : ""}">${esc({ running: "working", suspended: "waiting", completed: "done", failed: "could not finish", cancelled: "cancelled" }[s] || s)}</span>`;
const when = t => t ? new Date(t).toLocaleString() : "";
const waiting = w => ({ approval: "waiting for an approval", review: "waiting for your review", question: "waiting for your answer", budget: "paused: budget reached", provider: "paused: model provider unavailable", usage_limit: "paused: model usage limit", auth: "paused: sign in to the model again", kill_switch: "stopped by the kill switch", timer: "waiting until a set time", invalid_request: "paused: the model rejected the request" })[w] || w || "";

// The page re-renders every few seconds to pick up changes, but only replaces
// the nav or the main area when its markup changed: rebuilding unchanged parts
// would reset scroll, open menus, streamed text and unsent attachments.
let shown = {};
function swap(el, key, html) { if (shown[key] === html) return false; shown[key] = html; el.innerHTML = html; return true; }
async function render() {
  const root = $("#root");
  if (!token) { shown = {}; root.innerHTML = loginView(); $("#login").onsubmit = async e => { e.preventDefault(); token = $("#tok").value.trim(); store.set("magnus.token", token); try { me = await api("GET", "/v1/me"); render(); } catch (err) { toast("That key did not work."); } }; return; }
  if (!me) { try { me = await api("GET", "/v1/me"); } catch { return; } }
  const owner = me.roles.includes("owner");
  let items = []; try { items = (await api("GET", "/v1/inbox")).items; } catch {}
  notifyNew(items);
  const open = items.filter(i => i.status === "open" && i.can_respond).length;
  if (!$("#main")) { shown = {}; root.innerHTML = `<div class="app"><nav id="nav"></nav><main id="main"></main></div>`; }
  const nav = $("#nav");
  if (swap(nav, "nav", `<div class="brand">Magnus</div>
      <a href="#" data-p="inbox" class="${view.page === "inbox" ? "on" : ""}">Inbox ${open ? `<span class="badge">${open}</span>` : ""}</a>
      <a href="#" data-p="tasks" class="${view.page === "tasks" || view.page === "task" ? "on" : ""}">Tasks</a>
      ${owner ? `<a href="#" data-p="settings" class="${view.page === "settings" ? "on" : ""}">Settings</a>` : ""}
      <div class="who">${esc(me.name || me.id)}<br><a href="#" id="signout" class="small">Sign out</a></div>`)) {
    nav.querySelectorAll("a[data-p]").forEach(a => a.onclick = e => { e.preventDefault(); view = { page: a.dataset.p }; render(); });
    $("#signout").onclick = e => { e.preventDefault(); store.del("magnus.token"); token = null; me = null; render(); };
  }
  const main = $("#main"), started = view;
  const html = view.page === "inbox" ? inboxView(items, owner) : view.page === "tasks" ? await tasksView() : view.page === "task" ? await taskView(view.task) : view.page === "settings" ? await settingsView() : "";
  if (view !== started) return; // the person moved on while this render was fetching
  if (swap(main, "main", html)) {
    if (view.page === "tasks") wireComposer();
    if (view.page === "task") streamLive(view.task);
    wire(main);
  }
  clearTimeout(timer); timer = setTimeout(refresh, 4000);
}
// Desktop app: notify about new items that need this person.
let seen = null;
function notifyNew(items) {
  if (!window.magnusDesktop) return;
  const mine = items.filter(i => i.status === "open" && i.can_respond);
  if (seen) for (const i of mine) if (!seen.has(i.id)) window.magnusDesktop.notify("Magnus needs you", i.summary || i.kind);
  seen = new Set(mine.map(i => i.id));
}
async function refresh() { if (document.activeElement && ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName)) { timer = setTimeout(refresh, 4000); return; } if (token) render(); }

function loginView() {
  return `<div class="login card"><h1>Sign in to Magnus</h1><p class="muted">Paste the access key your administrator gave you.</p>
    <form id="login"><input id="tok" type="password" autocomplete="current-password" aria-label="Access key" placeholder="Access key"><div class="row" style="margin-top:12px"><button class="primary">Sign in</button></div></form></div>`;
}

function inboxView(items, owner) {
  const open = items.filter(i => i.status === "open");
  if (!open.length) return `<h1>Inbox</h1><div class="empty">Nothing needs you right now.</div>`;
  const order = { approval: 0, question: 1, review: 2, tool_change: 3, tool_review: 4, policy_proposal: 5, notice: 6, message: 7 };
  open.sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9) || a.created_at.localeCompare(b.created_at));
  return `<h1>Inbox</h1>` + open.map(card).join("");
}
function taskLink(i) { return i.task_id ? `<a href="#" data-task="${esc(i.task_id)}" class="small">Open the task</a>` : ""; }
function card(i) {
  const d = i.details || {}; const can = i.can_respond;
  const head = (label, extra = "") => `<div class="spread"><strong>${esc(label)}</strong><span class="row">${extra}<span class="muted small">${when(i.created_at)}</span></span></div>`;
  const btns = (list) => can ? `<div class="row" style="margin-top:12px">${list}</div>` : `<p class="muted small">Waiting for someone who can decide this.</p>`;
  if (i.kind === "approval") {
    const unknown = d.reason === "unknown_outcome";
    const taint = d.taint && (d.taint.untrusted || d.taint.private) ? `<p class="small"><span class="chip warn">The task has read ${[d.taint.untrusted && "outside content", d.taint.private && "private data"].filter(Boolean).join(" and ")}</span></p>` : "";
    return `<div class="card risk-${esc(d.risk)}">${head(unknown ? "Did this happen? Send it again?" : "Approve this action?", `<span class="chip warn">${esc(d.risk)}</span>`)}
      <p>${esc(d.why)}</p>${taint}<div class="small muted">${esc(d.app)} · ${esc(d.tool)}</div><pre>${esc(JSON.stringify(d.input, null, 2))}</pre>${taskLink(i)}
      ${btns(unknown
        ? `<button class="primary" data-act="approve" data-id="${i.id}" data-scope="once">Send it again</button><button data-act="reject" data-id="${i.id}">Treat it as not done</button>`
        : `<button class="primary" data-act="approve" data-id="${i.id}" data-scope="once">Approve once</button>${String(d.rule || "").startsWith("kernel:") ? "" : `<button data-act="approve" data-id="${i.id}" data-scope="task">Approve for this task</button>`}<button data-act="reject" data-id="${i.id}">Decline</button>`)}</div>`;
  }
  if (i.kind === "question") return `<div class="card">${head("The worker has a question")}<p>${esc(d.question)}</p>${(d.options || []).length ? `<p class="small muted">Options: ${d.options.map(esc).join(" · ")}</p>` : ""}${taskLink(i)}
      ${can ? `<textarea id="ans-${i.id}" aria-label="Your answer" placeholder="Your answer"></textarea>` : ""}${btns(`<button class="primary" data-act="answer" data-id="${i.id}">Send answer</button>`)}</div>`;
  if (i.kind === "review") return `<div class="card">${head("Check the result", `<span class="chip">review</span>`)}<p>${esc(d.summary)}</p>
      <p class="small muted">These criteria have no automatic check, so you decide:</p><ul>${(d.criteria || []).map(c => `<li>${esc(c.description)}</li>`).join("")}</ul>${taskLink(i)}
      ${can ? `<textarea id="note-${i.id}" aria-label="Note" placeholder="Note (optional; required to send it back)"></textarea>` : ""}${btns(`<button class="primary" data-act="accept" data-id="${i.id}">Accept</button><button data-act="reject-review" data-id="${i.id}">Send back</button>`)}</div>`;
  if (i.kind === "policy_proposal") return `<div class="card">${head("The worker proposes a policy change", `<span class="chip">${esc(d.layer)}</span>`)}<p>${esc(d.rationale)}</p><pre>${esc(d.cedar)}</pre>
      <p class="small muted">Nothing changes unless you accept.</p>${btns(`<button class="primary" data-act="accept-policy" data-id="${i.id}">Accept</button><button data-act="reject-policy" data-id="${i.id}">Reject</button>`)}</div>`;
  if (i.kind === "tool_change") return `<div class="card risk-irreversible">${head("An app changed one of its tools", `<span class="chip bad">disabled</span>`)}<p>${esc(i.summary)}</p><p class="small muted">New description, written by the app (read it carefully):</p><pre>${esc(d.description)}</pre>
      ${btns(`<button data-act="approve-tool" data-id="${i.id}">Approve the new definition</button><button data-act="reject-tool" data-id="${i.id}">Keep it disabled</button>`)}</div>`;
  if (i.kind === "schedule_proposal") return `<div class="card">${head("The worker proposes a recurring task", `<span class="chip">${d.every_minutes ? "every " + d.every_minutes + " min" : "daily at " + esc(d.daily_at)}</span>`)}<p>${esc(d.text)}</p>
      <p class="small muted">It would run on its own, as you. Nothing is scheduled unless you accept.</p>${btns(`<button class="primary" data-act="accept-policy" data-id="${i.id}">Accept</button><button data-act="reject-policy" data-id="${i.id}">Decline</button>`)}</div>`;
  if (i.kind === "tool_review") return `<div class="card">${head("Review an app's tool descriptions", `<span class="chip">${esc(d.app)}</span>`)}<p>${esc(i.summary)}</p>
      ${(d.tools || []).map(t => `<div class="small muted">${esc(t.tool)}</div><pre>${esc(t.description)}</pre>`).join("")}<p class="small muted">These texts were written by the app's maker. Approve them only if they describe the tools plainly and give no orders.</p>
      ${btns(`<button class="primary" data-act="approve-tool" data-id="${i.id}">Approve</button><button data-act="reject-tool" data-id="${i.id}">Keep hidden</button>`)}</div>`;
  if (i.kind === "message") { const t = d.taint || {}; return `<div class="card">${head("A note from the worker")}<p>${esc(i.summary)}</p>${t.untrusted ? `<p class="small"><span class="chip warn">Written after reading outside content: treat it as information, not instructions</span></p>` : ""}${taskLink(i)}${btns(`<button data-act="dismiss" data-id="${i.id}">Dismiss</button>`)}</div>`; }
  const ev = d.evidence ? `<details><summary class="small">Evidence</summary><pre>${esc(JSON.stringify(d.evidence, null, 2))}</pre></details>` : "";
  const budget = d.reason === "budget";
  return `<div class="card">${head(i.summary)}${ev}${taskLink(i)}${btns(`${budget ? `<button class="primary" data-act="extend" data-id="${i.id}">Double the budget and continue</button>` : d.reason ? `<button class="primary" data-act="resume-notice" data-id="${i.id}">Continue</button>` : ""}<button data-act="dismiss" data-id="${i.id}">Dismiss</button>`)}</div>`;
}

async function tasksView() {
  const [{ tasks }, { schedules }] = await Promise.all([api("GET", "/v1/tasks"), api("GET", "/v1/schedules")]);
  tasks.sort((a, b) => b.created_at.localeCompare(a.created_at));
  return `<h1>Tasks</h1><div class="card"><label for="newtask"><strong>New task</strong></label><p class="small muted">Say what you need in plain words. The worker plans it, does it, and shows you the evidence.</p>
    <textarea id="newtask" placeholder="For example: Summarize the attached contracts into a table of parties, dates and amounts, and email it to Dana."></textarea>
    <div class="files" id="files"></div>
    <div class="spread" style="margin-top:10px"><div class="row"><label class="small"><input type="file" id="attach" multiple hidden><button type="button" id="attachbtn">Attach files</button></label><button type="button" id="mic" title="Speak your task">Speak</button></div><button class="primary" id="send">Start</button></div></div>
    <details class="card"><summary><strong>Recurring tasks</strong> <span class="muted small">(${schedules.length})</span></summary>
      ${schedules.map(x => `<div class="spread" style="padding:6px 0"><div>${esc(x.text)}<div class="small muted">${x.every_minutes ? "every " + x.every_minutes + " minutes" : "daily at " + esc(x.daily_at)} · next ${when(x.next)}</div></div><button data-act="unschedule" data-sched="${esc(x.id)}">Remove</button></div>`).join("")}
      <div class="row" style="margin-top:8px"><input type="text" id="schedtext" placeholder="What to do" style="flex:1;min-width:220px"><input type="text" id="schedat" placeholder="HH:MM" style="max-width:90px" aria-label="Daily time"><button data-act="schedule">Add daily</button></div></details>
    ${tasks.length ? tasks.map(t => `<div class="card task" data-task="${esc(t.task_id)}"><div>${esc(t.title)}</div><div>${statusChip(t.status)}</div><div class="muted small">${when(t.created_at)}${t.waiting_on ? " · " + esc(waiting(t.waiting_on)) : ""}</div><div></div></div>`).join("") : `<div class="empty">No tasks yet.</div>`}`;
}
let pending = [];
function wireComposer() {
  pending = [];
  $("#attachbtn").onclick = () => $("#attach").click();
  $("#attach").onchange = async e => { for (const f of e.target.files) { const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(f); }); pending.push({ name: f.name, media_type: f.type || "application/octet-stream", data_b64: b64 }); } $("#files").innerHTML = pending.map(p => `<span class="chip">${esc(p.name)}</span>`).join(""); };
  $("#send").onclick = async () => { const text = $("#newtask").value.trim(); if (!text) { toast("Write what you need first."); return; } $("#send").disabled = true; try { const r = await api("POST", "/v1/tasks", { text, attachments: pending }); view = { page: "task", task: r.task_id }; render(); } catch (e) { toast(e.message); $("#send").disabled = false; } };
  $("#mic").onclick = voice;
}
let rec = null;
async function voice() {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const chunks = [];
    rec = new MediaRecorder(stream); rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => { stream.getTracks().forEach(t => t.stop()); rec = null; $("#mic").textContent = "Speak";
      const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" }); const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
      try { const r = await api("POST", "/v1/transcribe", { media_type: blob.type, data_b64: b64 }); const ta = $("#newtask"); ta.value = (ta.value ? ta.value + " " : "") + r.text; ta.focus(); } catch (e) { toast("Could not transcribe: " + e.message); } };
    rec.start(); $("#mic").textContent = "Stop";
  } catch (e) { toast("The microphone is not available."); }
}

async function taskView(id) {
  const t = await api("GET", "/v1/tasks/" + id); const tl = await api("GET", "/v1/tasks/" + id + "/timeline");
  const crit = (t.criteria || []).map(c => { const m = c.verified === true ? `<span class="mark ok" aria-label="verified">✓</span>` : c.verified === false ? `<span class="mark bad" aria-label="failed">✗</span>` : `<span class="mark wait" aria-label="not yet checked">○</span>`;
    return `<div class="crit">${m}<div>${esc(c.description)}<div class="small muted">${c.check ? `checked with ${esc(c.check.tool)}` : "reviewed by a person"}${c.verified_by ? " · " + esc(c.verified_by) : ""}</div>${c.evidence ? `<details><summary class="small">Evidence</summary><pre>${esc(JSON.stringify(c.evidence, null, 2))}</pre></details>` : ""}</div></div>`; }).join("");
  const steps = (tl.steps || []).map(s => `<details><summary>${s.calls.length ? s.calls.map(c => `<code>${esc(c.tool)}</code>${c.is_error ? ' <span class="chip bad">error</span>' : ""}`).join(", ") : "note"}</summary>
      ${s.text ? `<p class="step-text">${esc(s.text)}</p>` : ""}${s.calls.map(c => `<div class="small muted">${esc(c.tool)} input</div><pre>${esc(JSON.stringify(c.input, null, 2))}</pre>${c.result != null ? `<div class="small muted">result</div><pre>${esc(c.result)}</pre>` : `<div class="small muted">no result yet</div>`}`).join("")}</details>`).join("");
  const active = !["completed", "failed", "cancelled"].includes(t.status);
  return `<div class="spread"><h1>${esc(t.title)}</h1>${statusChip(t.status)}</div>
    ${t.waiting_on ? `<p class="muted">${esc(waiting(t.waiting_on))}</p>` : ""}${t.summary ? `<div class="card"><strong>${t.status === "completed" ? "Result" : "Outcome"}</strong><p class="step-text">${esc(t.summary)}</p></div>` : ""}
    ${(t.outputs || []).length ? `<div class="card"><strong>Files</strong><div class="row" style="margin-top:8px">${t.outputs.map(o => `<button data-dl="${esc(o.id)}" data-name="${esc(o.name)}" data-task-id="${esc(id)}">${esc(o.name)} <span class="muted small">${Math.max(1, Math.round(o.size / 1024))} KB</span></button>`).join("")}</div></div>` : ""}
    <div class="card"><strong>How the worker knows it is done</strong>${crit ? `<div style="margin-top:8px">${crit}</div>` : `<p class="muted small">The worker has not written its done-criteria yet.</p>`}</div>
    <div class="live" id="live"></div>
    <h2>What it did</h2><div class="card">${steps || `<p class="muted small">No steps yet.</p>`}</div>
    <p class="small muted">${esc(t.model?.adapter)} · ${esc(t.model?.name)} · ${t.usage?.model_calls ?? 0} model calls · ${t.usage?.actions ?? 0} actions · $${(t.usage?.cost_usd ?? 0).toFixed(2)}</p>
    <div class="row">${t.status === "suspended" && !["approval", "review", "question"].includes(t.waiting_on) ? `<button class="primary" data-act="resume" data-task-id="${esc(id)}">Continue</button>` : ""}${active ? `<button data-act="cancel" data-task-id="${esc(id)}">Stop this task</button>` : ""}</div>`;
}
let live = null;
async function streamLive(id) {
  if (live && live.id === id) return; if (live) live.ctrl.abort();
  const ctrl = new AbortController(); live = { id, ctrl };
  try { const r = await fetch("/v1/tasks/" + id + "/live", { headers: { authorization: "Bearer " + token }, signal: ctrl.signal }); const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); let i; while ((i = buf.indexOf("\n\n")) >= 0) { const f = buf.slice(0, i); buf = buf.slice(i + 2); const d = f.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join(""); if (!d) continue; const el = $("#live"); if (el) { el.textContent += JSON.parse(d).text; } } } } catch {}
}

async function settingsView() {
  const [{ adapters }, pol, sec, cur] = await Promise.all([api("GET", "/v1/adapters"), api("GET", "/v1/policies"), api("GET", "/v1/secrets"), api("GET", "/v1/model")]);
  const kill = (await api("GET", "/v1/health")).kill_switch;
  return `<h1>Settings</h1>
    <div class="card"><div class="spread"><div><strong>Kill switch</strong><p class="small muted">Stops every task at once and refuses every action until you release it. Released tasks stay paused until you continue them.</p></div>
      ${kill ? `<button data-act="kill-off">Release</button>` : `<button class="danger" data-act="kill-on">Stop everything</button>`}</div></div>
    <h2>Models</h2><div class="card"><strong>New tasks run on</strong> <code>${esc(cur.adapter)}</code> · <code>${esc(cur.model)}</code>
      <div class="row" style="margin-top:8px"><select id="madapter" aria-label="Adapter">${adapters.map(a => `<option ${a.id === cur.adapter ? "selected" : ""}>${esc(a.id)}</option>`).join("")}</select><input type="text" id="mname" value="${esc(cur.model)}" aria-label="Model id" style="max-width:260px"><button data-act="set-model">Use</button></div></div>
    ${adapters.map(a => `<div class="card"><div class="spread"><strong>${esc(a.id)}</strong><span class="row">${a.conformance ? `<span class="chip ${a.conformance.passed ? "ok" : "bad"}">conformance ${a.conformance.passed ? "passed" : "failed"} (${esc(a.conformance.model)})</span>` : `<span class="chip warn">not verified</span>`}</span></div>
      <div class="small muted">${a.running ? esc(a.running.adapter + " " + a.running.version) : "not running"}</div>
      <div class="row" style="margin-top:10px"><button data-act="signin" data-adapter="${esc(a.id)}">Sign in</button><button data-act="conformance" data-adapter="${esc(a.id)}">Run conformance</button></div><div id="signin-${esc(a.id)}">${signins[a.id] || ""}</div><div id="conf-${esc(a.id)}"></div></div>`).join("")}
    <h2>Policy</h2><div class="card"><p class="small muted">What the worker may do on its own (execute) and what it must ask about (request_approval), written in Cedar. Lower layers can only narrow the organization's.</p>
      <label class="small" for="orgpol">Organization layer</label><textarea id="orgpol" style="min-height:160px;font-family:var(--mono)">${esc(pol.layers.org ?? pol.default_org)}</textarea><div class="row" style="margin-top:8px"><button class="primary" data-act="save-policy">Save</button></div></div>
    <h2>App credentials</h2><div class="card"><p class="small muted">Stored encrypted. The worker never sees them. Stored now: ${sec.names.map(n => `<code>${esc(n)}</code>`).join(", ") || "none"}.</p>
      <div class="row"><input type="text" id="secname" placeholder="name, e.g. mail_token" style="max-width:220px"><input type="password" id="secval" placeholder="value" style="max-width:320px"><button data-act="save-secret">Store</button></div></div>`;
}

function wire(main) {
  main.querySelectorAll("[data-task]").forEach(el => el.onclick = e => { e.preventDefault(); view = { page: "task", task: el.dataset.task }; render(); });
  main.querySelectorAll("[data-dl]").forEach(b => b.onclick = async () => {
    const r = await fetch(`/v1/tasks/${b.dataset.taskId}/outputs/${b.dataset.dl}`, { headers: { authorization: "Bearer " + token } });
    if (!r.ok) { toast("Could not download."); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = b.dataset.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  main.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, act = b.dataset.act; b.disabled = true;
    try {
      const respond = body => api("POST", "/v1/inbox/" + id, body);
      if (act === "approve") await respond({ decision: "approve", scope: b.dataset.scope });
      if (act === "reject") await respond({ decision: "reject" });
      if (act === "answer") await respond({ decision: "answer", text: $("#ans-" + id).value });
      if (act === "accept") await respond({ decision: "accept", text: $("#note-" + id)?.value });
      if (act === "reject-review") await respond({ decision: "reject", text: $("#note-" + id)?.value });
      if (act === "accept-policy") await respond({ decision: "accept" });
      if (act === "reject-policy" || act === "reject-tool") await respond({ decision: "reject" });
      if (act === "approve-tool") await respond({ decision: "approve" });
      if (act === "extend") await respond({ decision: "extend" });
      if (act === "resume-notice") await respond({ decision: "resume" });
      if (act === "dismiss") await respond({ decision: "dismiss" });
      if (act === "resume") await api("POST", `/v1/tasks/${b.dataset.taskId}/resume`, {});
      if (act === "cancel") await api("POST", `/v1/tasks/${b.dataset.taskId}/cancel`, {});
      if (act === "kill-on") { if (!confirm("Stop every task and refuse every action?")) { b.disabled = false; return; } await api("POST", "/v1/kill-switch", { engaged: true }); }
      if (act === "kill-off") await api("POST", "/v1/kill-switch", { engaged: false });
      if (act === "schedule") { await api("POST", "/v1/schedules", { text: $("#schedtext").value.trim(), daily_at: $("#schedat").value.trim() }); toast("Scheduled."); }
      if (act === "unschedule") await api("DELETE", "/v1/schedules/" + b.dataset.sched);
      if (act === "set-model") { await api("PUT", "/v1/model", { adapter: $("#madapter").value, model: $("#mname").value.trim() }); toast("New tasks will use this model."); }
      if (act === "save-policy") { await api("PUT", "/v1/policies/org", { cedar: $("#orgpol").value }); toast("Policy saved."); }
      if (act === "save-secret") { await api("PUT", "/v1/secrets/" + encodeURIComponent($("#secname").value.trim()), { value: $("#secval").value }); toast("Stored."); }
      if (act === "signin") { await signIn(b.dataset.adapter); return; }
      if (act === "signin-key") { await keyFinish[b.dataset.adapter]?.(); return; }
      if (act === "conformance") { const el = $("#conf-" + b.dataset.adapter); el.innerHTML = `<p class="small muted">Running the suite against the live provider…</p>`; const r = await api("POST", `/v1/adapters/${b.dataset.adapter}/conformance`, {}); el.innerHTML = `<pre>${esc(r.checks.map(c => `${c.passed ? "PASS" : "FAIL"} ${c.name}${c.simulated ? " (simulated)" : ""}: ${c.detail}`).join("\n"))}</pre>`; b.disabled = false; return; }
      render();
    } catch (e) { toast(e.message); } finally { b.disabled = false; }
  });
}
// Sign-in progress per adapter, kept across the page's periodic re-render.
// OAuth sign-ins are device sign-ins: the person approves on the provider's
// site and the appliance finishes by itself, so the page only waits.
const signins = {}, keyFinish = {};
function showSignin(adapter, html) { signins[adapter] = html; const el = $("#signin-" + adapter); if (el) el.innerHTML = html; }
async function signIn(adapter) {
  const step = await api("POST", `/v1/adapters/${adapter}/sign-in`, {});
  if (step.event === "error") { showSignin(adapter, `<p class="small" style="color:var(--bad)">${esc(step.message)}</p>`); return; }
  const kind = step.flow.kind;
  const head = `<div style="margin-top:10px"><p class="small">${esc(step.instructions)}</p>${step.url ? `<p><a href="${esc(step.url)}" target="_blank" rel="noopener">Open the sign-in page</a></p>` : ""}${step.user_code ? `<p>Code: <code>${esc(step.user_code)}</code></p>` : ""}`;
  const finish = async input => {
    try { await api("POST", `/v1/adapters/${adapter}/sign-in/complete`, { flow: step.flow, input }); showSignin(adapter, `<p class="small" style="color:var(--ok)">Signed in.</p>`); }
    catch (e) { showSignin(adapter, `<p class="small" style="color:var(--bad)">${esc(e.message)}</p>`); }
  };
  if (kind !== "api_key") { showSignin(adapter, head + `<p class="small muted">Waiting for you to approve…</p></div>`); await finish({}); return; }
  keyFinish[adapter] = () => finish({ api_key: $("#si-" + adapter).value });
  showSignin(adapter, head + `<input type="password" id="si-${adapter}" placeholder="API key"><div class="row" style="margin-top:8px"><button class="primary" data-act="signin-key" data-adapter="${esc(adapter)}">Finish sign-in</button></div></div>`);
}
render();
</script>
</body>
