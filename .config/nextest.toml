# cargo-nextest (.github/workflows/desktop.yml, "Unit, invariant and scratch
# tests"). Every test has a time limit: a test that hangs is killed and
# fails by name, and the run goes on. Unbounded, one hung sign-in held the
# shared runner until the job's 150 minutes ran out (runs 41877670131,
# 41902140293) and every pull request behind it waited.
[profile.default]
# Eight tests at once, not thirty-two: each scratch test drives an
# appliance with docker and sometimes a browser, and the 32-core build box
# is shared by two CI jobs, the developers working on it, and the test
# services. Uncapped, overlapping suites paged 16 GB to swap and held load
# past 100 until sign-ins and clicks timed out (#294).
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 5 }

# The admin console's browser suites and the microVM connector suites are
# the long ones: they passed in up to 454 s and 290 s with two runs on the
# build box at once.
[[profile.default.overrides]]
filter = 'binary_id(/^magnus-scratch::(admin_|brokered)/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# What the cap of eight is for: anything that works the machine (#294).
[test-groups]
working = { max-threads = 8 }

# CI's: every failure is reported, not only the first.
[profile.ci]
fail-fast = false
# The eight that work, and room for every clock-waiting test beside them
# (the overrides below), so that those never wait for a slot.
test-threads = 33
slow-timeout = { period = "60s", terminate-after = 5 }

# Everything but the tests that spend their time asleep, waiting for a
# schedule's or a watch's real minute to pass, holds a working slot. Those
# use no CPU while they wait, and they held half of the suite's slot-time
# (#518). One schedule test also drives a browser, so it keeps its slot.
# Only CI: a developer's run passes its own cap.
[[profile.ci.overrides]]
filter = 'not ((binary_id(/^magnus-scratch::(schedules|schedule_approved_once|ended_schedules|schedule_threads|watch_poll|ownership_review)$/) & not test(=a_schedule_that_keeps_failing_pauses_until_its_person_resumes_it)) | (binary_id(=magnus-scratch::chat) & (test(=a_confirmed_schedule_carries_its_scope) | test(=a_schedule_from_chat_fires_after_a_restart))))'
test-group = 'working'
