id = "google-chat"
version = "1.0.0"
name = "Google Chat"
summary = "Magnus can read and search your Chat conversations and send messages for you."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "email"
abilities = ["Find a conversation or a decision when you ask about it", "Catch you up on spaces you have been away from", "Send messages for you, when you allow it"]
asks = ["See your spaces and conversations", "See who is in your spaces", "Read your messages", "Send messages as you"]
can = "Read and search your conversations, and send messages when you allow it"
cannot = "Delete messages, or add or remove people"
letters = "Ch"
tint = "#1A7F64"
kind = "remote"
endpoint = "https://chatmcp.googleapis.com/mcp/v1"
# Messages reach a conversation's members, who may be outside the organisation.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
scopes = ["https://www.googleapis.com/auth/chat.spaces.readonly", "https://www.googleapis.com/auth/chat.memberships.readonly", "https://www.googleapis.com/auth/chat.messages.readonly", "https://www.googleapis.com/auth/chat.messages.create"]

# Exactly the tools the live server lists (checked by tests/scratch/tests/google.rs).
[tools]
list_messages = "read"
search_messages = "read"
search_conversations = "read"
send_message = "irreversible"
