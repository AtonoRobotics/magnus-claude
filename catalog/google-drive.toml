id = "google-drive"
version = "1.0.0"
name = "Google Drive"
summary = "Magnus can find and read your files, make, copy, move and trash them, and share one or delete one for good when you allow it."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "files"
abilities = ["Find a file when you describe it", "Read documents, sheets and other files", "Make new files and folders, or copies of yours", "Rename, move or trash files", "Share a file or delete one for good, when you allow it"]
asks = ["See, change, share and delete your files"]
can = "Find, read and download your files, make, copy, rename, move and trash them, and share them or delete one for good (it asks you before each share and each delete)"
cannot = "Give a file to someone else to own"
letters = "Dr"
tint = "#1E7F5C"
# Brokered (Google's hosted Drive server refuses Magnus with 403, as
# Gmail's did): Alpha Vector's server over Drive's API (`brokered/drive`),
# its image named by digest and built from this commit by
# `brokered/build.sh`; each person's runs in a microVM of its own that
# reaches only Google's API host, and people sign in at Google.
kind = "brokered"
endpoint = "sha256:a363ab439b4d2b94674b2bb5c9fe013864fe99fa89158ed49b33a9f2152e8b32"
hosts = ["www.googleapis.com"]
issuer = "https://accounts.google.com"
# A file it shares reaches anyone the person shares it with. What comes
# back is their private files, written by others too.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
# `drive` alone: the one Drive scope on the project's consent screen
# (AtonoRobotics/magnus-claude#117), and the only one among the
# authorization scopes of every method the tools use (files list, get,
# export, create, copy, update, delete; permissions list, create, delete):
# `drive.file` reaches only files Magnus made or was given, and
# `drive.readonly` changes nothing.
scopes = ["https://www.googleapis.com/auth/drive"]

# Exactly the tools its image lists (`every_tool_is_classed_in_the_manifest`).
[tools]
search_files = "read"
list_recent_files = "read"
get_file_metadata = "read"
get_file_permissions = "read"
read_file_content = "read"
download_file_content = "read"
create_file = "reversible_write"
create_folder = "reversible_write"
copy_file = "reversible_write"
# Drive keeps a file's earlier versions, and the trash keeps a file 30 days.
update_file = "reversible_write"
trash_file = "reversible_write"
untrash_file = "reversible_write"
# Someone's access taken away can be given back.
unshare_file = "reversible_write"
# A share tells the person (or opens the file to anyone with its link), and
# what they saw cannot be called back; a delete skips the trash
# (files.delete: "Permanently deletes a file owned by the user without
# moving it to the trash").
share_file = "irreversible"
delete_file = "irreversible"
