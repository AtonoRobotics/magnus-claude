id = "google-gmail"
version = "1.0.0"
name = "Gmail"
summary = "Magnus can search and read your email, write and send drafts, and file, label or trash messages."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "email"
abilities = ["Find an email or a thread when you ask about it", "Summarize long threads and catch you up", "Write drafts and send one when you allow it", "Label, file or trash messages"]
asks = ["Know which account is signed in", "See the email address of that account", "See the name on that account", "Read, write and send your email", "Read, change and label your email"]
can = "Read your email, write and send drafts, and label, file or trash messages"
cannot = "Delete email for good"
letters = "Gm"
tint = "#B3261E"
kind = "google"
endpoint = "https://gmail.googleapis.com/gmail/v1"
# Sending a draft reaches whoever it is addressed to, who may be anyone.
# What comes back is their private mail, written by others.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
scopes = ["openid", "email", "profile", "https://mail.google.com/", "https://www.googleapis.com/auth/gmail.modify"]

# The tools the appliance calls on Gmail's API (checked by google.rs).
[tools]
search_threads = "read"
get_thread = "read"
get_message = "read"
list_drafts = "read"
get_draft = "read"
list_labels = "read"
create_draft = "reversible_write"
send_draft = "irreversible"
create_label = "reversible_write"
label_message = "reversible_write"
unlabel_message = "reversible_write"
label_thread = "reversible_write"
unlabel_thread = "reversible_write"
update_message_labels = "reversible_write"
trash_message = "reversible_write"
untrash_message = "reversible_write"
trash_thread = "reversible_write"
untrash_thread = "reversible_write"
mark_message_spam = "reversible_write"
unmark_message_spam = "reversible_write"
mark_thread_spam = "reversible_write"
unmark_thread_spam = "reversible_write"
apply_sensitive_message_label = "irreversible"
apply_sensitive_thread_label = "irreversible"
