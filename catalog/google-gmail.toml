id = "google-gmail"
version = "1.0.0"
name = "Gmail"
summary = "Magnus can search and read your email, write drafts for you to send, and file, label or trash messages."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "email"
abilities = ["Find an email or a thread when you ask about it", "Summarize long threads and catch you up", "Write drafts for you to read and send", "Label, file or trash messages"]
asks = ["See your email and its settings", "Write drafts and send email", "Read, change and label your email"]
can = "Read your email, write drafts, and label, file or trash messages"
cannot = "Send email, or delete email for good"
letters = "Gm"
tint = "#B3261E"
kind = "remote"
endpoint = "https://gmailmcp.googleapis.com/mcp/v1"
# Its tools write drafts, labels and the trash in the person's own mailbox:
# what reaches it stays theirs (it cannot send). What comes back is their
# private mail, written by others.
audience = "private"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Google's revocation endpoint (RFC 7009), where Disconnect ends a sign-in.
revoke = "https://oauth2.googleapis.com/revoke"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
scopes = ["https://www.googleapis.com/auth/gmail.readonly", "https://www.googleapis.com/auth/gmail.compose", "https://www.googleapis.com/auth/gmail.modify"]

# Exactly the tools the live server lists (checked by tests/scratch/tests/google.rs).
# The org context's search and fetch (org context build spec): Gmail's own
# search, and a thread read as plain text.
[source]
search = "search_threads"
query = "query"
fetch = "get_thread"
id = "threadId"
fetch_args = { messageFormat = "PLAIN_TEXT" }

[tools]
search_threads = "read"
get_thread = "read"
get_message = "read"
list_drafts = "read"
get_draft = "read"
list_labels = "read"
create_draft = "reversible_write"
create_label = "reversible_write"
label_message = "reversible_write"
unlabel_message = "reversible_write"
label_thread = "reversible_write"
unlabel_thread = "reversible_write"
update_message_labels = "reversible_write"
trash_message = "reversible_write"
untrash_message = "reversible_write"
trash_thread = "reversible_write"
untrash_thread = "reversible_write"
mark_message_spam = "reversible_write"
unmark_message_spam = "reversible_write"
mark_thread_spam = "reversible_write"
unmark_thread_spam = "reversible_write"
apply_sensitive_message_label = "irreversible"
apply_sensitive_thread_label = "irreversible"
