[package]
name = "magnus-gmail"
description = "Gmail, brokered: an MCP server over Gmail's REST API, run in a microVM of its own for each person on the appliance."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "magnus-gmail"
path = "src/main.rs"

[dependencies]
magnus-brokered-kit = { path = "../kit" }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
webpki-roots = "1"

[dev-dependencies]
toml = "0.8"
