[package]
name = "magnus-scratch"
description = "Debugging scenarios built on the invariant harness. Not a contract; free to change."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magnus-invariants = { path = "../invariants" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
toml = "0.8"
tempfile = "3"
chrono = "0.4"
futures = "0.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
